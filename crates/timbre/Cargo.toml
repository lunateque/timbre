[package]
name = "timbre"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
timbre-kernel.workspace = true
timbre-edge-config.workspace = true
timbre-edge-http.workspace = true
timbre-edge-runtime.workspace = true
timbre-edge-sqlite.workspace = true
timbre-folders = { workspace = true, optional = true }
timbre-hello = { workspace = true, optional = true }
timbre-library = { workspace = true, optional = true }

[features]
default = ["folders", "hello", "library"]
folders = ["dep:timbre-folders"]
hello = ["dep:timbre-hello"]
library = ["dep:timbre-library"]
