[package]
name = "timbre-edge-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The `fuzz/` harness's seam: the `fuzzing` module over the request parsers.
# Off by default, so the shipped build carries no test-only surface.
fuzzing = ["timbre-edge-config/fuzzing"]

[dependencies]
bytes = { workspace = true }
form_urlencoded = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["full"] }
hyper-util = { workspace = true, features = [
    "http1",
    "http2",
    "server",
    "server-auto",
    "server-graceful",
    "tokio",
] }
percent-encoding = { workspace = true }
timbre-edge-config.workspace = true
timbre-kernel.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
