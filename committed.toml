# Commit-message style, checked by `committed` (see `just setup`); `cargo xtask commits`
# adds the rules this tool cannot express (body requirements, banned phrases, ASCII).
style = "conventional"
allowed_types = [
    "feat",
    "fix",
    "perf",
    "refactor",
    "docs",
    "test",
    "build",
    "ci",
    "chore",
    "revert",
    "style",
]
subject_length = 72
subject_capitalized = true
subject_not_punctuated = true
imperative_subject = true
no_fixup = true
no_wip = true
merge_commit = false
