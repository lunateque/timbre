[workspace]
resolver = "3"
members = ["crates/kernel", "crates/timbre", "crates/modules/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
timbre-kernel = { path = "crates/kernel" }
timbre-hello = { path = "crates/modules/hello" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Marking every value-returning public function #[must_use] buries the cases where it matters.
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
