[workspace]
resolver = "3"
members = ["crates/kernel", "crates/timbre", "crates/modules/hello", "crates/edge/runtime", "crates/edge/http", "crates/edge/sqlite", "crates/edge/config", "xtask"]
# `fuzz/` is its own workspace (own `[workspace]` and lockfile): nightly and
# clang live there and the stable gate must not resolve or build it.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
bytes = "1.12.1"
form_urlencoded = "1.2.2"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = "0.1.21"
percent-encoding = "2.3.2"
ra-ap-rustc_lexer = "=0.185.0"
rusqlite = "0.43.0"
serde = "1.0.229"
serde_json = "1.0.154"
timbre-edge-config = { path = "crates/edge/config" }
timbre-edge-http = { path = "crates/edge/http" }
timbre-edge-runtime = { path = "crates/edge/runtime" }
timbre-edge-sqlite = { path = "crates/edge/sqlite" }
timbre-kernel = { path = "crates/kernel" }
timbre-hello = { path = "crates/modules/hello" }
tokio = "1.54.1"
toml = "1.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Marking every value-returning public function #[must_use] buries the cases where it matters.
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
