[workspace]
resolver = "3"
members = ["crates/kernel", "crates/timbre", "crates/modules/activity", "crates/modules/audit", "crates/modules/auth", "crates/modules/auth_guard", "crates/modules/folders", "crates/modules/hello", "crates/modules/library", "crates/modules/playlists", "crates/edge/runtime", "crates/edge/http", "crates/edge/sqlite", "crates/edge/config", "crates/edge/crypto", "crates/edge/tags", "crates/edge/image", "crates/edge/fswatch", "crates/edge/text", "xtask"]
# `fuzz/` is its own workspace (own `[workspace]` and lockfile): nightly and
# clang live there and the stable gate must not resolve or build it.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
bytes = "1.12.1"
fast_image_resize = "=6.2.0"
form_urlencoded = "1.2.2"
getrandom = "=0.4.3"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = "0.1.21"
icu_casemap = "=2.4.0"
icu_normalizer = "=2.4.0"
icu_properties = "=2.4.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "=0.25.5"
notify = "=9.0.0"
percent-encoding = "2.3.2"
ra-ap-rustc_lexer = "=0.185.0"
rusqlite = "0.43.0"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "=0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "=2.6.1"
timbre-edge-config = { path = "crates/edge/config" }
timbre-edge-crypto = { path = "crates/edge/crypto" }
timbre-edge-fswatch = { path = "crates/edge/fswatch" }
timbre-edge-http = { path = "crates/edge/http" }
timbre-edge-image = { path = "crates/edge/image" }
timbre-edge-runtime = { path = "crates/edge/runtime" }
timbre-edge-sqlite = { path = "crates/edge/sqlite" }
timbre-edge-tags = { path = "crates/edge/tags" }
timbre-edge-text = { path = "crates/edge/text" }
timbre-kernel = { path = "crates/kernel" }
timbre-activity = { path = "crates/modules/activity" }
timbre-audit = { path = "crates/modules/audit" }
timbre-auth = { path = "crates/modules/auth" }
timbre-auth_guard = { path = "crates/modules/auth_guard" }
timbre-folders = { path = "crates/modules/folders" }
timbre-hello = { path = "crates/modules/hello" }
timbre-library = { path = "crates/modules/library" }
timbre-playlists = { path = "crates/modules/playlists" }
tokio = "1.54.1"
toml = "1.2.1"
xxhash-rust = { version = "=0.8.21", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Marking every value-returning public function #[must_use] buries the cases where it matters.
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
