# Checked by the pinned cargo-deny version; keep the schema current.
# In phase 0 the only external crates are the two xtask depends on; the
# allow list below covers their full trees.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace members are private path dependencies without version reqs;
# wildcards stay denied for registry crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
